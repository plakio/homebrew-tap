name: Clean Ubuntu installation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Bootstrap disposable Ubuntu without developer tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git procps file
          useradd --create-home --shell /bin/bash brewtest
          mkdir -p /home/linuxbrew/.linuxbrew/bin
          git clone --depth 1 https://github.com/Homebrew/brew /home/linuxbrew/.linuxbrew/Homebrew
          ln -s ../Homebrew/bin/brew /home/linuxbrew/.linuxbrew/bin/brew
          chown -R brewtest:brewtest /home/linuxbrew
      - uses: actions/checkout@v5
      - name: Use this PR's tap files
        run: |
          tap=/home/linuxbrew/.linuxbrew/Homebrew/Library/Taps/plakio/homebrew-tap
          mkdir -p "$tap"
          cp -R . "$tap/"
          chown -R brewtest:brewtest "$tap"
          su brewtest -c 'PATH=/home/linuxbrew/.linuxbrew/bin:$PATH HOMEBREW_NO_AUTO_UPDATE=1 brew --version'
      - name: Verify actionable missing-tools failure
        run: su brewtest -c "PATH=/home/linuxbrew/.linuxbrew/bin:\$PATH bash '$GITHUB_WORKSPACE/tests/linux-install.sh' missing-tools"
      - name: Explicitly add prerequisites in disposable container
        run: apt-get install -y --no-install-recommends build-essential
      - name: Install and test Plak with prerequisites
        run: su brewtest -c "PATH=/home/linuxbrew/.linuxbrew/bin:\$PATH bash '$GITHUB_WORKSPACE/tests/linux-install.sh' installed-tools"
