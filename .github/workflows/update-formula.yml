name: Update Formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name (for example, plak-cli or wp-mcp-cli)
        required: true
        type: string
      version:
        description: Version or tag to publish (for example, 0.1.0 or v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    env:
      FORMULA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.formula || inputs.formula }}
      VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.version || inputs.version }}
    steps:
      - name: Check out tap
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Generate formula
        run: ./scripts/update-formula.sh "$FORMULA" "$VERSION"

      - name: Validate formula
        run: ruby -c "Formula/${FORMULA}.rb"

      - name: Install and test formula
        run: |
          brew tap plakio/tap
          cp "Formula/${FORMULA}.rb" "$(brew --repository plakio/tap)/Formula/${FORMULA}.rb"
          brew install --build-from-source "plakio/tap/${FORMULA}"
          brew test "plakio/tap/${FORMULA}"

      - name: Clean up Homebrew test
        if: always()
        run: |
          brew uninstall "${FORMULA}" || true
          brew untap plakio/tap || true

      - name: Commit formula
        run: |
          if git diff --quiet -- "Formula/${FORMULA}.rb"; then
            echo "Formula is already up to date."
            exit 0
          fi

          VERSION="${VERSION#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/${FORMULA}.rb"
          git commit -m "${FORMULA} ${VERSION}"
          git push origin main
