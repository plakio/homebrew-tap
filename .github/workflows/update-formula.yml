name: Update Formula

on:
  repository_dispatch:
    types: [new-release]
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name (for example, plak-cli or wp-mcp-cli)
        required: true
        type: string
      version:
        description: Version or tag to publish (for example, 0.1.0 or v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Resolve formula and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            FORMULA="${{ github.event.client_payload.formula }}"
            VERSION="${{ github.event.client_payload.version }}"
          else
            FORMULA="${{ inputs.formula }}"
            VERSION="${{ inputs.version }}"
          fi
          # Backward-compat: plak-cli's old notify did not send formula.
          if [ -z "$FORMULA" ]; then
            FORMULA="plak-cli"
          fi
          FORMULA="${FORMULA#v}"
          VERSION="${VERSION#v}"
          echo "FORMULA=$FORMULA" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate formula
        env:
          FORMULA: ${{ steps.resolve.outputs.FORMULA }}
          VERSION: ${{ steps.resolve.outputs.VERSION }}
        run: ./scripts/update-formula.sh "$FORMULA" "$VERSION"

      - name: Validate formula
        env:
          FORMULA: ${{ steps.resolve.outputs.FORMULA }}
        run: ruby -c "Formula/${FORMULA}.rb"

      - name: Install and test formula
        env:
          FORMULA: ${{ steps.resolve.outputs.FORMULA }}
        run: |
          brew tap plakio/tap
          cp "Formula/${FORMULA}.rb" "$(brew --repository plakio/tap)/Formula/${FORMULA}.rb"
          brew install --build-from-source "plakio/tap/${FORMULA}"
          brew test "plakio/tap/${FORMULA}"

      - name: Clean up Homebrew test
        if: always()
        env:
          FORMULA: ${{ steps.resolve.outputs.FORMULA }}
        run: |
          brew uninstall "${FORMULA}" || true
          brew untap plakio/tap || true

      - name: Commit formula
        env:
          FORMULA: ${{ steps.resolve.outputs.FORMULA }}
          VERSION: ${{ steps.resolve.outputs.VERSION }}
        run: |
          formula_path="Formula/${FORMULA}.rb"

          # Detect whether the formula was actually regenerated (tracked
          # change OR newly created). `git diff --quiet` does not pick up
          # untracked files, so we check `git status --porcelain` instead.
          if [ -z "$(git status --porcelain -- "$formula_path")" ]; then
            echo "Formula is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$formula_path"
          git commit -m "${FORMULA} ${VERSION}"
          git push origin main
